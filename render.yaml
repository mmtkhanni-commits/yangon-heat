# Render blueprint: API, static frontend and the hourly alert job.
# Push this repository to GitHub, then in Render choose New → Blueprint.

databases:
  - name: yangon-heat-db
    plan: free
    databaseName: yangonheat
    user: yangonheat

services:
  - type: web
    name: yangon-heat-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yangon-heat-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false          # set this to your frontend URL after the first deploy
      - key: PYTHON_VERSION
        value: "3.12"

  - type: web
    name: yangon-heat-app
    runtime: static
    rootDir: Frontend
    staticPublishPath: .
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache      # so an updated service worker is picked up
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# The hourly alert job runs on GitHub Actions instead of a Render cron service,
